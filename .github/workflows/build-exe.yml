# À placer dans le dépôt : .github/workflows/build-exe.yml
# Construit MiseAJourFFBB.exe (Windows) à partir de scripts/push_ffbb.py.
# Lancement : onglet « Actions » du dépôt GitHub -> « Construire MiseAJourFFBB.exe » -> « Run workflow ».
# Le .exe est ensuite téléchargeable en bas de la page de l'exécution (section « Artifacts »).
name: Construire MiseAJourFFBB.exe

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/push_ffbb.py"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install pyinstaller requests

      - name: Construire l'exécutable
        run: pyinstaller --onefile --clean --name MiseAJourFFBB scripts/push_ffbb.py

      - uses: actions/upload-artifact@v4
        with:
          name: MiseAJourFFBB-windows
          path: dist/MiseAJourFFBB.exe
          if-no-files-found: error