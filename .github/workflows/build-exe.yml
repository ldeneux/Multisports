# À placer dans le dépôt : .github/workflows/build-exe.yml
# Construit UNIQUEMENT MiseAJourFFBB_Club.exe (Windows) à partir de scripts/push_ffbb_club.py.
# (L'ancien programme MiseAJourFFBB.exe a son propre fichier : push_ffbb.yml.)
# Lancement : onglet « Actions » -> « Construire MiseAJourFFBB_Club.exe » -> « Run workflow »,
# ou automatiquement à chaque modification de scripts/push_ffbb_club.py.
# Le .exe est ensuite téléchargeable en bas de la page de l'exécution (section « Artifacts »).
name: Construire MiseAJourFFBB_Club.exe

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/push_ffbb_club.py"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install pyinstaller requests

      - name: Construire l'exécutable
        run: pyinstaller --onefile --clean --name MiseAJourFFBB_Club scripts/push_ffbb_club.py

      - uses: actions/upload-artifact@v4
        with:
          name: MiseAJourFFBB_Club-windows
          path: dist/MiseAJourFFBB_Club.exe
          if-no-files-found: error